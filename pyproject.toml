[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enboite"
version = "0.0.1"
description = "Give your AI agent full control over a system through SSH."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "JuanForge"}
]

dependencies = [
    "requests",
    "requests[socks]",
    "rich",
    "paramiko",
    "psutil", # non permit sur android
    "ddgs",
    "pydantic",
    "tqdm",
    "py-cpuinfo",
    "distro",
    "screeninfo",
    "pillow",
    "humanize"
]

[project.optional-dependencies]
full = [
    "sounddevice",
    "soundfile",
    "orjson",
    "docker",
    "geoip2",
    "notify-py",
    "mss"
]
dev = [
    "types-docker",
    "types-paramiko",
    "types-psutil",
    "types-tqdm"
]

[project.scripts]
enboite = "enboite.main:main"

[project.urls]
Homepage = "https://github.com/JuanForge/EnBoite"
Repository = "https://github.com/JuanForge/EnBoite"